<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Learn — ACJ DASHB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --success: #6BE3A4;
  --warning: #F2C063;
  --danger: #FF6B6B;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #050506;
  color: var(--text-secondary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 60px;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(224, 118, 88, 0.16), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(180, 180, 200, 0.06), transparent 50%);
  filter: blur(40px);
  pointer-events: none;
  z-index: -2;
  animation: drift 36s ease-in-out infinite alternate;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none;
  z-index: -1;
}
@keyframes drift {
  0%   { transform: translate3d(0,0,0); }
  100% { transform: translate3d(-22px, 14px, 0); }
}

.page {
  max-width: 1100px;
  margin: 0 auto;
}

.dash-title {
  margin: 0 0 14px;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.025em;
  background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
@media (max-width: 480px) { .dash-title { font-size: 22px; } }

.placeholder-card {
  border-radius: 16px;
  padding: 28px 20px;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.30) 100%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
  text-align: center;
}
.placeholder-icon { font-size: 34px; margin-bottom: 10px; filter: grayscale(100%) brightness(1.3); opacity: 0.8; }
.placeholder-title { color: var(--text-primary); font-weight: 700; font-size: 15px; margin-bottom: 6px; }
.placeholder-sub {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-tertiary);
}

.lrn-subnav {
  display: flex; background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06); border-radius: 12px;
  padding: 4px; gap: 3px; margin-bottom: 18px;
}
.lrn-seg-btn {
  flex: 1; padding: 10px 8px; border: none; background: transparent;
  color: var(--text-tertiary); border-radius: 8px;
  font-family: inherit; font-size: 12.5px; font-weight: 600;
  cursor: pointer; transition: background 0.15s, color 0.15s;
  -webkit-tap-highlight-color: transparent;
  text-decoration: none; display: flex; align-items: center; justify-content: center;
}
.lrn-seg-btn.active {
  background: linear-gradient(180deg, #ffffff 0%, #e8e5dd 100%);
  color: #0a0a0b;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 4px 12px rgba(0,0,0,0.35);
}
.lrn-seg-btn.disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<div class="page">
  <h1 class="dash-title">Learn</h1>
  <div class="lrn-subnav">
    <a href="japanese.html" class="lrn-seg-btn">Japonés</a>
    <a href="reading.html" class="lrn-seg-btn">Lectura</a>
    <span class="lrn-seg-btn disabled" title="Próximamente">Música</span>
  </div>
  <div class="placeholder-card">
    <div class="placeholder-icon">📚</div>
    <div class="placeholder-title">Elegí Japonés o Lectura arriba</div>
    <div class="placeholder-sub">// Música próximamente</div>
  </div>
</div>
</body>
</html>
